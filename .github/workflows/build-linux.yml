# Orgtree for Linux (Ubuntu x86_64, or arm64): AppImage + .deb, built from exactly `inputs.ref`.
# Reusable: release.yml calls it once per architecture; a push to ci-test/orgtree-linux
# runs the x64 build standalone, a push to ci-test/orgtree-linux-arm64 the arm64 build.
# Untested-on-desktop prototype: see docs/ci-release.md for what Linux lacks yet.
#
# `arch` picks the runner (ubuntu-22.04, or ubuntu-22.04-arm: both build natively, nothing
# is cross-compiled) and the names. x64 keeps the names it always had; the arm64 build's
# carry the architecture (.github/ci/linux/arch.sh): Orgtree-<v>-arm64.AppImage,
# latest-linux-arm64.yml, orgtree_<v>_arm64.deb, build-info-linux-arm64.json, and the
# artifact orgtree-linux-arm64. Every step runs for both; the arm64 build also measures
# its glibc floor and checks that every program in the package is aarch64.
name: build-linux

on:
  workflow_call:
    inputs:
      ref: {type: string, required: true}
      signing: {type: string, default: test}
      arch: {type: string, default: x64}   # x64 or arm64
  push:
    branches: ['ci-test/orgtree-linux', 'ci-test/orgtree-linux-arm64']

permissions: {contents: read}

env:
  # Mirrors the local Windows build: rustc 1.94.0-nightly f52090008 (2025-12-10), Node 24.12.0.
  RUST_TOOLCHAIN: nightly-2025-12-12
  NODE_VERSION: 24.12.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  # A call names the architecture; a push to a test branch is that branch's.
  ORGTREE_LINUX_ARCH: ${{ inputs.arch || (github.ref_name == 'ci-test/orgtree-linux-arm64' && 'arm64' || 'x64') }}
  # '' for x64 and '-arm64' for arm64, as in .github/ci/linux/arch.sh.
  ARCH_SUFFIX: ${{ (inputs.arch || (github.ref_name == 'ci-test/orgtree-linux-arm64' && 'arm64' || 'x64')) == 'arm64' && '-arm64' || '' }}

jobs:
  build:
    # 22.04 (glibc 2.35) so the binaries also run on Ubuntu 22.04; 24.04 would raise the floor to 2.39.
    runs-on: ${{ (inputs.arch || (github.ref_name == 'ci-test/orgtree-linux-arm64' && 'arm64' || 'x64')) == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Architecture
        run: |
          case "$ORGTREE_LINUX_ARCH" in x64) want=x86_64 ;; arm64) want=aarch64 ;; *) echo "::error::arch must be x64 or arm64, not $ORGTREE_LINUX_ARCH"; exit 1 ;; esac
          echo "building Linux $ORGTREE_LINUX_ARCH on $(uname -m), $(. /etc/os-release; echo "$PRETTY_NAME"), $(ldd --version | head -1)"
          [ "$(uname -m)" = "$want" ] || { echo "::error::this runner is $(uname -m), the $ORGTREE_LINUX_ARCH build needs $want"; exit 1; }

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            patchelf file imagemagick librsvg2-bin xvfb xauth libfuse2 dbus \
            zlib1g-dev pkg-config desktop-file-utils

      - name: Rust toolchain (preinstalled rustup)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          echo "RUSTC_VERSION=$(rustc --version | tr ' ' '_')" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/rs/target
            engine/mailhub/target
          key: linux${{ env.ARCH_SUFFIX }}-cargo-${{ env.RUSTC_VERSION }}-${{ hashFiles('engine/rs/Cargo.lock', 'engine/mailhub/Cargo.lock') }}
          restore-keys: linux${{ env.ARCH_SUFFIX }}-cargo-${{ env.RUSTC_VERSION }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pg-cache
        with:
          path: build/linux/postgresql
          key: linux${{ env.ARCH_SUFFIX }}-postgresql-${{ hashFiles('.github/ci/linux/build-postgres.sh') }}

      - name: PostgreSQL 18.6 (from source)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        run: bash .github/ci/linux/build-postgres.sh build/linux/postgresql

      - name: Rust engine (release)
        working-directory: engine/rs
        run: |
          export ORGTREE_RELEASE_BUILD=1
          export ORGTREE_BUILD_COMMIT="$(git rev-parse --short HEAD)"
          cargo build --release --locked -j "$(nproc)"

      - name: Engine unit tests - tool bridge, Antigravity hooks, process groups, where Codex is found
        working-directory: engine/rs
        run: |
          # The release profile reuses the build above: only the engine crate compiles again, as tests.
          export ORGTREE_RELEASE_BUILD=1
          export ORGTREE_BUILD_COMMIT="$(git rev-parse --short HEAD)"
          log="$RUNNER_TEMP/unix-unit-tests.log"
          cargo test --release --locked -j "$(nproc)" -p orgtree-engine --bin orgtree-engine -- bridge:: runtime::agy:: winproc:: providers::codex_location_tests:: host::installed_app_tests:: 2>&1 | tee "$log"
          grep -E '^test result: ok\. [1-9][0-9]* passed' "$log"
          # every area must have run at least one test
          for m in bridge runtime::agy winproc providers::codex_location_tests host::installed_app_tests; do
            n="$(grep -c -E "^test ${m}::.* \.\.\. ok$" "$log" || true)"
            echo "$m: $n passed"
            [ "$n" -ge 1 ] || { echo "::error::no $m unit test ran"; exit 1; }
          done

      - name: Mail hub (release)
        working-directory: engine/mailhub
        run: cargo build --release --locked -j "$(nproc)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci, typecheck, build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Linux icons (PNG renders of the .ico/.svg)
        run: bash .github/ci/linux/icons.sh

      - name: Linux package preflight
        run: bash .github/ci/linux/preflight.sh

      - name: electron-builder (AppImage + deb)
        env:
          ELECTRON_RUN_AS_NODE: ''
        run: npx electron-builder --config .github/ci/linux/electron-builder.linux.cjs --linux "--$ORGTREE_LINUX_ARCH" --publish never

      - name: Collect assets
        id: assets
        run: bash .github/ci/linux/collect.sh build/linux/out

      # arm64 only (the x64 job is left as it was): every program and library in the package
      # is aarch64, and none needs a glibc newer than Ubuntu 22.04's 2.35. Measured per file;
      # the report is kept as the artifact orgtree-linux-arm64-glibc.
      - name: glibc floor and architecture of the packaged programs (arm64)
        if: env.ORGTREE_LINUX_ARCH == 'arm64'
        run: node .github/ci/linux/glibc-floor.mjs "release/linux$ARCH_SUFFIX-unpacked" "$ORGTREE_LINUX_ARCH" 2.35 build/linux/glibc/glibc-floor-linux-arm64.json

      - name: glibc report (arm64)
        if: (success() || failure()) && env.ORGTREE_LINUX_ARCH == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orgtree-linux-arm64-glibc
          path: build/linux/glibc/
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke - packaged engine starts and answers
        run: bash .github/ci/linux/smoke-engine.sh "release/linux$ARCH_SUFFIX-unpacked"

      - name: Smoke - AppImage under xvfb
        run: bash .github/ci/linux/smoke-appimage.sh build/linux/out

      - name: Smoke - install the .deb with apt
        run: bash .github/ci/linux/smoke-deb.sh build/linux/out

      # The background engine that starts at login (a systemd user unit, else XDG autostart).
      - name: Background engine - unit tests
        if: hashFiles('tests/unix-boot-engine.test.mjs') != ''
        run: node --test tests/unix-boot-engine.test.mjs

      - name: Engine launch and the engine's own copy - unit tests
        if: hashFiles('tests/engine-runtime-copy.test.mjs') != ''
        run: node --test tests/unix-engine-launch.test.mjs tests/engine-runtime-copy.test.mjs

      - name: AppImage updater - unit tests
        if: hashFiles('tests/appimage-update.test.mjs') != ''
        run: node --test tests/appimage-update.test.mjs

      - name: Linux desktop and orgtree:// link registration - unit tests
        if: hashFiles('tests/orgtree-links-linux.test.mjs') != ''
        run: node --test tests/orgtree-links-linux.test.mjs

      - name: Background engine - registered, started and stopped (deb layout)
        if: hashFiles('.github/ci/boot-engine-smoke.mjs') != ''
        run: |
          # The runner has no systemd user manager until lingering is on for its user.
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          if systemctl --user show-environment >/dev/null 2>&1; then echo "systemd --user: available"; else echo "systemd --user: NOT available (autostart fallback)"; fi
          # a CLI only the login shell's PATH finds: the engine started by systemd must find it too
          bash .github/ci/unix/login-shell-cli.sh codex
          node .github/ci/boot-engine-smoke.mjs "release/linux$ARCH_SUFFIX-unpacked/resources/engine/orgtree-engine" \
            --expect-cli codex "$HOME/.npm-global/bin/codex"

      - name: Background engine - registered, started and stopped (AppImage)
        if: hashFiles('.github/ci/boot-engine-smoke.mjs') != ''
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          v="$(node -p "require('./package.json').version")"
          node .github/ci/boot-engine-smoke.mjs "release/linux$ARCH_SUFFIX-unpacked/resources/engine/orgtree-engine" --appimage "release/Orgtree-$v$ARCH_SUFFIX.AppImage" \
            --expect-cli codex "$HOME/.npm-global/bin/codex"

      # This build's AppImage starting as on a stock Ubuntu desktop (.github/ci/linux/desktop-check.sh):
      # a D-Bus session bus, umask 0002 for the session and for systemd --user's services (the
      # runner's PAM gives a user with a private group that, as Ubuntu's does). The desktop
      # must attach to its background engine and finish starting, with the engine's folders
      # private (0700): fresh, over folders 4.1.1 left at 0775, and through the autostart
      # fallback. Each runs whatever the one before it did. Last, with ~/.config at 0775 (not
      # Orgtree's to change): refused at once with the folder and its chmod named, then fine.
      - name: Desktop-like start - systemd, fresh install
        env:
          DESKTOP_CHECK_EXPECT_PRIVATE: '1'
        run: bash .github/ci/linux/desktop-check.sh "release/Orgtree-$(node -p "require('./package.json').version")$ARCH_SUFFIX.AppImage" build/linux/smoke-logs/desktop-fresh fresh

      - name: Desktop-like start - systemd, over folders a 4.1.1 install left at 0775
        if: success() || failure()
        env:
          DESKTOP_CHECK_EXPECT_PRIVATE: '1'
        run: bash .github/ci/linux/desktop-check.sh "release/Orgtree-$(node -p "require('./package.json').version")$ARCH_SUFFIX.AppImage" build/linux/smoke-logs/desktop-repair repair

      - name: Desktop-like start - autostart fallback (systemctl --user fails)
        if: success() || failure()
        env:
          DESKTOP_CHECK_EXPECT_PRIVATE: '1'
        run: bash .github/ci/linux/desktop-check.sh "release/Orgtree-$(node -p "require('./package.json').version")$ARCH_SUFFIX.AppImage" build/linux/smoke-logs/desktop-autostart autostart

      - name: Desktop-like start - ~/.config writable by the group (refused with the fix, then fixed)
        if: success() || failure()
        env:
          DESKTOP_CHECK_EXPECT_PRIVATE: '1'
        run: bash .github/ci/linux/desktop-check.sh "release/Orgtree-$(node -p "require('./package.json').version")$ARCH_SUFFIX.AppImage" build/linux/smoke-logs/desktop-unsafe-config unsafe-config

      # Without FUSE (SteamOS has no libfuse2): the runtime's extraction is shared by every launch
      # and deleted when any of them exits, so the engine runs from its own copy and keeps its
      # files through a second launch and the desktop's death (desktop-check.sh, mode no-fuse).
      - name: Desktop-like start - without FUSE (extract and run), the engine from its own copy
        if: (success() || failure()) && hashFiles('apps/desktop/main/engine-runtime.ts') != ''
        env:
          DESKTOP_CHECK_EXPECT_PRIVATE: '1'
        run: bash .github/ci/linux/desktop-check.sh "release/Orgtree-$(node -p "require('./package.json').version")$ARCH_SUFFIX.AppImage" build/linux/smoke-logs/desktop-no-fuse no-fuse

      # Real Orgtree tool calls by hired agents, one per CLI lane (Claude and Codex over stdio,
      # Antigravity over the bridge socket), with the rig's fake CLI as every CLI.
      - name: Rig fake CLI (stands in for Claude Code, Codex and Antigravity)
        run: cargo build --release --locked --manifest-path tools/rig/fakecli/Cargo.toml --target-dir build/fakecli

      - name: Smoke - agent tool calls (Claude, Codex and Antigravity lanes), hosted hub, leftovers
        run: |
          # the leftover check needs the fake CLI's `spawn` step
          if grep -q '"spawn"' tools/rig/fakecli/src/main.rs; then export AGENT_SMOKE_LEFTOVERS=1; fi
          bash .github/ci/unix/agent-tools-smoke.sh "release/linux$ARCH_SUFFIX-unpacked/resources/engine/orgtree-engine" \
            "release/linux$ARCH_SUFFIX-unpacked/resources/ui" build/fakecli/release/orgtree-fakecli build/linux/smoke-logs/agent-tools

      # The AppImage updates itself: N installed in ~/Applications, N+1 (the same build one
      # patch version up) on a loopback feed. The app's own automatic path downloads N+1,
      # swaps the file in place and relaunches; the app and its background engine must come
      # back on N+1. Neither test AppImage is staged.
      - name: Update test - the AppImage updates itself (N to N+1)
        if: hashFiles('apps/desktop/main/appimage-update.ts') != ''
        env:
          ELECTRON_RUN_AS_NODE: ''
        run: bash .github/ci/linux/update-test.sh build/linux/smoke-logs/update-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orgtree-linux${{ env.ARCH_SUFFIX }}
          path: build/linux/out/*
          if-no-files-found: error
          retention-days: 14

      - name: Smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orgtree-linux${{ env.ARCH_SUFFIX }}-smoke-logs
          path: build/linux/smoke-logs/
          if-no-files-found: ignore
          retention-days: 7
