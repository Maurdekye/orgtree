# Pushes a release's standalone engine images to GHCR when the release is published:
# ghcr.io/<owner>/orgtree-engine:<version> (+ latest) and, from the agents image,
# :<version>-agents (+ latest-agents); the latest* tags only for a stable release
# (never for an alpha/beta). Each image is the release's own asset
# (orgtree-engine-standalone-<v>[-agents]-docker-amd64.tar.gz), checked against
# SHA256SUMS.txt and its build-info file and `docker load`ed: nothing is rebuilt, so
# GHCR, the archives and the Linux binary are one build. Afterwards it reads the tags
# back from the registry and checks their config digest (.github/ci/standalone/publish-image.sh).
# Uses only the run's GITHUB_TOKEN (packages: write). GitHub creates the package
# private on its first push: an owner sets it public once (docs/ci-release.md,
# "Standalone engine").
#   gh workflow run publish-standalone-image.yml -R Maurdekye/orgtree -f tag=v4.5.11 [-f parts=agents]
name: publish-standalone-image

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag: {type: string, required: true}
      parts: {type: string, default: all}     # all | agents
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag whose standalone image to push, e.g. v4.5.11
        type: string
        required: true
      parts:
        description: all = the plain and the agents image; agents = only the agents image
        type: choice
        options: [all, agents]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-standalone-image-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PARTS: ${{ inputs.parts || 'all' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/ci
          persist-credentials: false
      - name: Push the release's images and read them back
        run: |
          json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          if [ "$(jq -r .isDraft <<<"$json")" = true ]; then echo "::error::$TAG is still a draft: publish it first"; exit 1; fi
          prerelease="$(jq -r .isPrerelease <<<"$json")"
          [ "$PARTS" = agents ] || bash .github/ci/standalone/publish-image.sh "$TAG" build-info-standalone.json "$prerelease"
          bash .github/ci/standalone/publish-image.sh "$TAG" build-info-standalone-agents.json "$prerelease"
