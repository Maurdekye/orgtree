# Orgtree release: one pushed tag in, one DRAFT GitHub release out. Never publishes.
#
#   resolve  the tag, the version surfaces and the notes file, in seconds
#   windows  build-windows.yml: the canonical six assets (build-info.json,
#            engine-hashes.json, latest.yml or beta.yml, Orgtree-Setup-<v>.exe and its
#            .blockmap, packaged-hashes.json), built and gated as `npm run
#            release:windows` does after its test gate, plus a launch smoke
#   macos    build-macos.yml: Orgtree-<v>-arm64.dmg and .zip (unsigned prototype,
#            ad-hoc signed, no update feed) and build-info-macos.json, with a launch smoke
#   linux    build-linux.yml: Orgtree-<v>.AppImage, its update feed latest-linux.yml (or
#            beta-linux.yml), orgtree_<v>_amd64.deb (no updater) and build-info-linux.json,
#            with launch smokes and a real N to N+1 AppImage update on the runner
#   linux-arm64  build-linux.yml again, for arm64 on an ARM runner: Orgtree-<v>-arm64.AppImage,
#            latest-linux-arm64.yml, orgtree_<v>_arm64.deb and build-info-linux-arm64.json,
#            with the same smokes. A CANDIDATE while LINUX_ARM64 below says so: built and
#            kept as the run's artifact candidate-linux-arm64-<tag>, never part of the release.
#   standalone  build-standalone.yml: the headless engine for Linux servers,
#            orgtree-engine-standalone-<v>-linux-x86_64.tar.gz, its Docker image as
#            orgtree-engine-standalone-<v>-docker-amd64.tar.gz and
#            build-info-standalone.json, each smoked (every release ships them:
#            docs/ci-release.md). Publishing the release pushes the same image to
#            GHCR (publish-standalone-image.yml).
#   standalone-agents  build-standalone-agents.yml: the "agents" image on top of that
#            image (Claude Code, Codex, Node.js, ssh, python3, docker CLI) as
#            orgtree-engine-standalone-<v>-agents-docker-amd64.tar.gz and
#            build-info-standalone-agents.json; pushed as <v>-agents on publish.
#   stage    checks the whole asset set, then SHA256SUMS.txt over every asset
#   draft    `gh release create --draft`; a person checks the draft and publishes it
#
# The release's test gate (tools/release-verification.mjs) is NOT run here: it refuses a
# test baseline recorded on another machine, so it stays on the release PC and runs
# before the tag is pushed. Modes: a pushed tag v4.1.0 (or v4.1.0-beta.1) is a real
# release; a push to ci-test/orgtree-release, or a manual run, is a test (same build,
# no release; the staged assets are left as the run's artifact).
# How to cut, check, publish and roll back a release: docs/ci-release.md.
name: release

on:
  push:
    tags: ['v*']
    branches: ['ci-test/orgtree-release']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build as a test (no release)
        type: string
        required: true

permissions:
  contents: read

env:
  # Linux arm64: `candidate` or `release`.
  #   candidate  the arm64 build runs beside the others, but stage neither waits for it
  #              nor takes its files: the staged set, SHA256SUMS.txt and the draft are
  #              what they are without it, and a red arm64 build changes nothing. Its
  #              four files and their SHA256SUMS-linux-arm64.txt are the run's artifact
  #              candidate-linux-arm64-<tag>, for testing.
  #   release    the four arm64 files are part of the release: stage requires them and
  #              lists them in SHA256SUMS.txt. To switch: this value, AND `linux-arm64`
  #              in stage's `needs` (stage refuses to run as `release` without it).
  #              Shipping arm64 in a published release is the owner's decision.
  LINUX_ARM64: release

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check the tag, versions and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            docs
            engine/rs/orgtree-engine/Cargo.toml
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: check
        # Only a pushed tag is a release. A manual run started from a tag ref is a
        # test too: it builds `inputs.ref`, which need not be the tag's commit.
        env:
          MODE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'test' }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .ci-tools/.github/ci/releasing/check-release.mjs

  windows:
    needs: resolve
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  macos:
    needs: resolve
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  linux:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  linux-arm64:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      arch: arm64

  # The arm64 build as something to hand out for testing, whatever LINUX_ARM64 says: its
  # four files and their hashes in one artifact. Nothing here is uploaded to a release.
  linux-arm64-candidate:
    needs: [resolve, linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-linux-arm64
          path: dist
      - name: Check the arm64 files and write SHA256SUMS-linux-arm64.txt
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          cd dist
          channel=latest
          if [ "$PRERELEASE" = true ]; then channel="${VERSION#*-}"; channel="${channel%%.*}"; fi
          have="$(ls | sort | tr '\n' ' ')"
          want="$(printf '%s\n' "Orgtree-$VERSION-arm64.AppImage" "$channel-linux-arm64.yml" "orgtree_${VERSION}_arm64.deb" build-info-linux-arm64.json | sort | tr '\n' ' ')"
          if [ "$have" != "$want" ]; then
            echo "::error::the arm64 build delivered [$have], expected [$want]"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS-linux-arm64.txt
          cat SHA256SUMS-linux-arm64.txt
          {
            echo "### Orgtree $VERSION for Linux arm64, commit $SHA ($LINUX_ARM64)"
            echo
            echo '| file | bytes | sha256 |'
            echo '|---|---:|---|'
            for f in *; do echo "| $f | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-linux-arm64-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  standalone:
    needs: resolve
    uses: ./.github/workflows/build-standalone.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}

  standalone-agents:
    needs: [resolve, standalone]
    uses: ./.github/workflows/build-standalone-agents.yml
    with:
      base_from: artifact
      commit: ${{ needs.resolve.outputs.sha }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}

  # Every platform must build: a release never goes out with a platform silently
  # missing. A flaky job can be re-run ("Re-run failed jobs") and the run carries on.
  # Linux arm64 is not one of them while it is a candidate (LINUX_ARM64 above): `needs`
  # leaves it out, so stage neither waits for it nor fails with it.
  stage:
    needs: [resolve, windows, macos, linux, linux-arm64, standalone, standalone-agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # By exact name: the builds also upload diagnostics artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-linux
          path: dist
      - name: Linux arm64 in the release needs its build
        if: env.LINUX_ARM64 == 'release' && !contains(toJSON(needs), '"linux-arm64"')
        run: |
          echo "::error::LINUX_ARM64 is release, but stage does not need the linux-arm64 job: add it to stage's needs"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.LINUX_ARM64 == 'release'
        with:
          name: orgtree-linux-arm64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-standalone
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-standalone-agents
          path: dist
      - name: Check the asset set and write SHA256SUMS.txt
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          cd dist
          channel=latest
          if [ "$PRERELEASE" = true ]; then channel="${VERSION#*-}"; channel="${channel%%.*}"; fi
          windows="build-info.json engine-hashes.json $channel.yml Orgtree-Setup-$VERSION.exe Orgtree-Setup-$VERSION.exe.blockmap packaged-hashes.json"
          macos="Orgtree-$VERSION-arm64.dmg Orgtree-$VERSION-arm64.zip build-info-macos.json"
          linux="Orgtree-$VERSION.AppImage $channel-linux.yml orgtree_${VERSION}_amd64.deb build-info-linux.json"
          # Linux arm64: four more files once it is part of the release, none while a candidate.
          case "${LINUX_ARM64:-}" in
            candidate) arm64="" ;;
            release) arm64="Orgtree-$VERSION-arm64.AppImage $channel-linux-arm64.yml orgtree_${VERSION}_arm64.deb build-info-linux-arm64.json" ;;
            *) echo "::error::LINUX_ARM64 must be candidate or release, not '${LINUX_ARM64:-}'"; exit 1 ;;
          esac
          standalone="orgtree-engine-standalone-$VERSION-linux-x86_64.tar.gz orgtree-engine-standalone-$VERSION-docker-amd64.tar.gz build-info-standalone.json"
          standalone="$standalone orgtree-engine-standalone-$VERSION-agents-docker-amd64.tar.gz build-info-standalone-agents.json"
          have="$(ls | sort | tr '\n' ' ')"
          want="$(printf '%s\n' $windows $macos $linux $arm64 $standalone | sort | tr '\n' ' ')"
          if [ "$have" != "$want" ]; then
            echo "::error::the builds delivered [$have], expected [$want] (Windows' canonical six, macOS 3, Linux 4, Linux arm64 $([ -n "$arm64" ] && echo 4 || echo 0), standalone 5)"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Orgtree $VERSION ($([ "$PRERELEASE" = true ] && echo prerelease || echo stable))"
            echo
            echo '| file | bytes | sha256 |'
            echo '|---|---:|---|'
            for f in *; do echo "| $f | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  # The only job with write access. It uploads exactly what `stage` checked, as a
  # draft; publishing is a person's decision (docs/ci-release.md).
  draft:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --prerelease="$PRERELEASE" --title "Orgtree $VERSION" \
            --notes-file "docs/release-notes-$VERSION.md" dist/*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,assets \
            --jq '"\(.name) draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "  \(.name)  \(.size)")'
