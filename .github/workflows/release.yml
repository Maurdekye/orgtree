# Orgtree release: one pushed tag in, one DRAFT GitHub release out. Never publishes.
#
#   resolve  the tag, the version surfaces and the notes file, in seconds
#   windows  build-windows.yml: the canonical six assets (build-info.json,
#            engine-hashes.json, latest.yml or beta.yml, Orgtree-Setup-<v>.exe and its
#            .blockmap, packaged-hashes.json), built and gated as `npm run
#            release:windows` does after its test gate, plus a launch smoke
#   macos    build-macos.yml: Orgtree-<v>-arm64.dmg and .zip (unsigned prototype,
#            ad-hoc signed, no update feed) and build-info-macos.json, with a launch smoke
#   linux    build-linux.yml: Orgtree-<v>.AppImage and orgtree_<v>_amd64.deb (prototype,
#            no update feed) and build-info-linux.json, with launch smokes
#   stage    checks the whole asset set, then SHA256SUMS.txt over every asset
#   draft    `gh release create --draft`; a person checks the draft and publishes it
#
# The release's test gate (tools/release-verification.mjs) is NOT run here: it refuses a
# test baseline recorded on another machine, so it stays on the release PC and runs
# before the tag is pushed. Modes: a pushed tag v4.1.0 (or v4.1.0-beta.1) is a real
# release; a push to ci-test/orgtree-release, or a manual run, is a test (same build,
# no release; the staged assets are left as the run's artifact).
# How to cut, check, publish and roll back a release: docs/ci-release.md.
name: release

on:
  push:
    tags: ['v*']
    branches: ['ci-test/orgtree-release']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build as a test (no release)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check the tag, versions and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            docs
            engine/rs/orgtree-engine/Cargo.toml
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: check
        # Only a pushed tag is a release. A manual run started from a tag ref is a
        # test too: it builds `inputs.ref`, which need not be the tag's commit.
        env:
          MODE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'test' }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .ci-tools/.github/ci/releasing/check-release.mjs

  windows:
    needs: resolve
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  macos:
    needs: resolve
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  linux:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Every platform must build: a release never goes out with a platform silently
  # missing. A flaky job can be re-run ("Re-run failed jobs") and the run carries on.
  stage:
    needs: [resolve, windows, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # By exact name: the builds also upload diagnostics artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orgtree-linux
          path: dist
      - name: Check the asset set and write SHA256SUMS.txt
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          cd dist
          channel=latest
          if [ "$PRERELEASE" = true ]; then channel="${VERSION#*-}"; channel="${channel%%.*}"; fi
          windows="build-info.json engine-hashes.json $channel.yml Orgtree-Setup-$VERSION.exe Orgtree-Setup-$VERSION.exe.blockmap packaged-hashes.json"
          macos="Orgtree-$VERSION-arm64.dmg Orgtree-$VERSION-arm64.zip build-info-macos.json"
          linux="Orgtree-$VERSION.AppImage orgtree_${VERSION}_amd64.deb build-info-linux.json"
          have="$(ls | sort | tr '\n' ' ')"
          want="$(printf '%s\n' $windows $macos $linux | sort | tr '\n' ' ')"
          if [ "$have" != "$want" ]; then
            echo "::error::the builds delivered [$have], expected [$want] (Windows' canonical six, macOS 3, Linux 3)"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Orgtree $VERSION ($([ "$PRERELEASE" = true ] && echo prerelease || echo stable))"
            echo
            echo '| file | bytes | sha256 |'
            echo '|---|---:|---|'
            for f in *; do echo "| $f | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  # The only job with write access. It uploads exactly what `stage` checked, as a
  # draft; publishing is a person's decision (docs/ci-release.md).
  draft:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --prerelease="$PRERELEASE" --title "Orgtree $VERSION" \
            --notes-file "docs/release-notes-$VERSION.md" dist/*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,assets \
            --jq '"\(.name) draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "  \(.name)  \(.size)")'
