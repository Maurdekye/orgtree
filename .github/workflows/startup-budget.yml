name: Startup budget
on: [push, pull_request]
jobs:
  startup-budget:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r tools/runtime-requirements.in
      - run: npm ci
      - run: python tools/test-startup.py
      - run: node --test tests/startup-engine.test.mjs
