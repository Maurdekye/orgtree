[package]
name = "orgtree-prototype-guard"
version = "0.1.0"
edition = "2021"
publish = false
description = "P03 shared prototype-root guard: the ONE definition of the live-location list, path canonicalization and prototype-marker validation, used by the WS1 custodian and the WS2 store service"
license = "MIT"

[lib]
path = "src/lib.rs"

# Same exact versions as every other P03 crate (M1 contract §2 row 1b); see
# DEPENDENCIES.md.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

# Owner-only ACL creation and read-back (src/acl.rs), Windows only. Same
# exact version and a subset of the features pg-custodian uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
