[package]
name = "orgtree-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "P03 store core: command executor, receipts, in-flight rows, output claims, Sent stub (CONTRACT-M1.md)"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# Pause points, unsafe controls and the harness channel (CONTRACT-M1 §5).
# Never enabled in a production build.
qualification = []
# The in-memory fake session, for pure tests here and in family crates.
fake = []

[dependencies]
# Versions are pinned to match every other P03 crate; see DEPENDENCIES.md.
tokio = { version = "=1.52.3", default-features = false, features = ["sync", "time", "rt", "macros"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "1", default-features = false, features = ["v4", "std", "serde"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-uuid-1", "with-serde_json-1"] }
bytes = "1"
# key grammar and horizon/skew constants for receipt lookup (read-only)
orgtree-op-receipt-codec = { path = "../op-receipt-codec" }
# WS4: the reviewed pure funding planner (legacy reallocate/_chain_acquire
# rules) is the decide half of reallocate, the credit decision and preview
# (r7 C6). In-repo path dependency; no third-party code.
orgtree-funding-core = { path = "../funding-core" }
# WS3a: the reviewed pure scope clamps (legacy _clamp_dirs/_clamp_tools/
# _clamp_vis/_apply_ceiling/_check_tier_ceiling) are the decide half of the
# new seat's scope (r7 C6). In-repo path dependency; no third-party code.
orgtree-scope-clamp = { path = "../scope-clamp" }

[dev-dependencies]
orgtree-store-schema = { path = "../store-schema" }
tokio = { version = "=1.52.3", default-features = false, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
# The fake session for this crate's own integration tests.
orgtree-store = { path = ".", features = ["fake"] }
