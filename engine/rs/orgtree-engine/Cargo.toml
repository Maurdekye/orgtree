[package]
name = "orgtree-engine"
version = "4.0.0-alpha.12"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Orgtree engine: agent runtime, storage, feeds and the desktop's window socket"

[[bin]]
name = "orgtree-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
http-body-util = "0.1"
hyper = "1"
bytes = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
arc-swap = "1"
papaya = "0.2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
fancy-regex = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
mime_guess = "2"
percent-encoding = "2"
dirs = "5"
rust_decimal = { version = "1", features = ["db-tokio-postgres", "serde-with-float"] }
toml = "0.8"
flate2 = "1"
orgtree-logged = { path = "../orgtree-logged" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }
